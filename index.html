<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Pendel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone-width column in the style of Västtrafik's trip planner — light-blue trip rows,
   departure stop and line badges on the left, departure–arrival times on the right. */
:root {
  --bg: #ffffff;
  --row: #eef6fb;
  --row-gone: #f2f3f4;
  --ink: #1f2a30;
  --muted: #5b666d;
  --line: #c8d0d6;
  --accent: #00699a;
  --accent-ink: #ffffff;
  --hl: #fdf1bd;
  --hl-ink: #1f2a30;
  --late: #a8540f;
  --bad: #c0261d;
  --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d161b; --row: #15242d; --row-gone: #161b1f; --ink: #e5ecf0; --muted: #9aa8b0; --line: #2b3a44;
    --accent: #5bb8e3; --accent-ink: #0d161b; --hl: #5a4a12; --hl-ink: #fff4c9; --late: #f0a35e; --bad: #ff8178;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d161b; --row: #15242d; --row-gone: #161b1f; --ink: #e5ecf0; --muted: #9aa8b0; --line: #2b3a44;
  --accent: #5bb8e3; --accent-ink: #0d161b; --hl: #5a4a12; --hl-ink: #fff4c9; --late: #f0a35e; --bad: #ff8178;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink); font: 15px/1.4 var(--f-body);
  padding-inline: 16px; padding-block: calc(env(safe-area-inset-top, 0px) + 14px) calc(env(safe-area-inset-bottom, 0px) + 32px);
  font-variant-numeric: tabular-nums;
}
main { max-width: 40rem; margin: 0 auto; display: grid; gap: 16px; }
[hidden] { display: none !important; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

header {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg); margin-inline: -16px; padding: 8px 16px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  border-bottom: 1px solid var(--line);
}
.brand { font: 700 1.35rem/1.1 var(--f-body); margin: 0; color: var(--ink); }
.brand small { display: block; font: 500 .78rem/1.3 var(--f-body); color: var(--muted); }

.switch { display: inline-flex; border: 2px solid var(--accent); border-radius: 999px; overflow: hidden; }
.switch button {
  border: 0; background: transparent; color: var(--accent); font: 600 .95rem/1 var(--f-body);
  padding: 9px 18px; cursor: pointer;
}
.switch button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

.route { margin: 0; color: var(--muted); font-size: .92rem; }
.route b { color: var(--ink); font-weight: 700; }

/* Next trip */
.hero { background: var(--accent); color: var(--accent-ink); border-radius: 6px; padding: 16px; display: grid; gap: 10px; }
.hero-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-weight: 600; font-size: .9rem; }
.countdown { font: 700 3.2rem/1 var(--f-body); letter-spacing: -.02em; }
.countdown span { font-size: 1.3rem; font-weight: 600; margin-left: 6px; }
.hero-legs { display: grid; gap: 8px; }
.hero-leg { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; min-width: 0; }
.hero-leg .where { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hero-leg .t { font-weight: 700; font-size: 1.1rem; }
.hero-foot { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-size: .88rem; border-top: 1px solid color-mix(in srgb, var(--accent-ink) 35%, transparent); padding-top: 10px; }
.hero .line { box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent-ink) 50%, transparent); }

/* Line badges take the line's own colours from the API. */
.line {
  display: inline-grid; place-items: center; min-width: 2.4rem; height: 1.65rem; padding: 0 6px; border-radius: 6px;
  font: 700 .95rem/1 var(--f-body); background: #fff; color: var(--accent); border: 2px solid currentColor;
}
.lines { display: flex; flex-wrap: wrap; gap: 6px; }

section > h2 { font: 700 .95rem/1.2 var(--f-body); margin: 0 0 8px; }
.list { border-top: 1px solid var(--line); box-shadow: 0 1px 3px rgb(0 0 0 / .08); }

/* One trip */
.trip {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 16px; align-items: start;
  background: var(--row); padding: 16px; border-bottom: 1px solid var(--line);
}
.trip-main { min-width: 0; display: grid; gap: 8px; }
.trip-from { font-size: 1.05rem; overflow-wrap: anywhere; }
.trip-from .platform { white-space: nowrap; }
.trip-from b { font-weight: 700; }
.trip-from .platform { color: var(--muted); }
.trip-note { font-size: .86rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
.trip-note .soon { color: var(--accent); font-weight: 700; }
.trip-note .tight { color: var(--late); }
.trip-times { display: grid; justify-items: end; gap: 2px; text-align: right; }
.tt { display: flex; align-items: baseline; gap: 2px; font: 700 1.2rem/1.2 var(--f-body); white-space: nowrap; }
.tt .t { padding: 1px 4px; border-radius: 2px; }
.tt .t.changed { background: var(--hl); color: var(--hl-ink); }
.planned { display: flex; gap: 2px; font-size: 1rem; color: var(--muted); white-space: nowrap; }
.planned s, .planned span { padding: 0 4px; min-width: 3.1rem; text-align: center; }
.dur { font-size: .9rem; color: var(--ink); margin-top: 4px; }

.lines .dir { align-self: center; font-size: .92rem; color: var(--muted); }
.onward { grid-column: 1 / -1; display: grid; gap: 6px; border-top: 1px dashed var(--line); padding-top: 10px; margin-top: 4px; }
.hop { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; font-size: .92rem; }
.hop .tight { color: var(--late); }
.hop-arr { font-weight: 700; font-size: 1.05rem; text-align: right; white-space: nowrap; }
.hop-arr small { display: block; font-weight: 500; font-size: .76rem; color: var(--muted); }
.hop.none { display: block; color: var(--muted); }
.trip.elsewhere { background: var(--bg); }
.trip.elsewhere .trip-from, .trip.elsewhere .tt { opacity: .7; }
.trip.gone { background: var(--row-gone); }
.trip.gone .trip-from, .trip.gone .tt, .trip.gone .lines, .trip.gone .onward { opacity: .55; }
.trip.gone .line { filter: grayscale(1); }
.pill-gone { display: inline-block; font: 700 .7rem/1 var(--f-body); letter-spacing: .06em; text-transform: uppercase; padding: 4px 7px; border-radius: 4px; background: var(--muted); color: var(--bg); }
.trip.cancelled .tt { text-decoration: line-through; color: var(--bad); }
.cancel { color: var(--bad); font-weight: 700; }
.late { color: var(--late); font-weight: 600; }

.now-divider { display: flex; align-items: center; gap: 10px; padding: 7px 16px; background: var(--bg); color: var(--accent); font: 700 .78rem/1 var(--f-body); letter-spacing: .08em; text-transform: uppercase; border-bottom: 2px solid var(--accent); }

.linkbtn {
  display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; margin: 6px 0 0;
  background: none; border: 0; color: var(--accent); font: 500 1rem/1 var(--f-body); padding: 14px; cursor: pointer;
}
.linkbtn svg { width: 1.3rem; height: 1.3rem; flex: none; }
.linkbtn:disabled { color: var(--muted); cursor: progress; }

.boards { display: grid; gap: 20px; }
.empty { padding: 16px; color: var(--muted); font-size: .92rem; background: var(--row); }

.status { display: flex; justify-content: space-between; align-items: center; gap: 10px; color: var(--muted); font-size: .84rem; }
.status .right { display: flex; gap: 10px; align-items: center; }
.refresh { background: none; border: 2px solid var(--accent); color: var(--accent); border-radius: 999px; padding: 6px 14px; font: 600 .84rem/1 var(--f-body); cursor: pointer; }
.linkish { background: none; border: 0; color: var(--muted); font: 500 .84rem/1 var(--f-body); text-decoration: underline; cursor: pointer; padding: 6px 0; }
.notice { background: var(--row); border-left: 4px solid var(--accent); padding: 10px 14px; font-size: .9rem; }
.notice.error { border-color: var(--bad); color: var(--bad); }
@media (prefers-reduced-motion: no-preference) { .hero, .list { transition: opacity .2s; } }
.loading .hero, .loading .list { opacity: .6; }

/* Shown while a Home/Office switch fetches its trips. */
.loader { display: grid; gap: 16px; }
.loader-board { background: var(--accent); color: var(--accent-ink); border-radius: 6px; padding: 16px; display: grid; gap: 12px; }
.eyebrow { font: 600 .8rem/1 var(--f-body); letter-spacing: .06em; text-transform: uppercase; opacity: .85; }
.loader-title { font: 700 1.6rem/1.15 var(--f-body); }
.loader-track { height: 4px; border-radius: 2px; background: color-mix(in srgb, var(--accent-ink) 30%, transparent); overflow: hidden; }
.loader-track span { display: block; height: 100%; width: 35%; border-radius: 2px; background: var(--accent-ink); }
.skel-row { display: grid; grid-template-columns: 1fr 5rem; gap: 16px; padding: 16px; background: var(--row); border-bottom: 1px solid var(--line); }
.skel { height: .9rem; border-radius: 4px; background: var(--line); }
.skel.short { width: 40%; margin-top: 10px; height: 1.4rem; }
@media (prefers-reduced-motion: no-preference) {
  .loader-track span { animation: slide 1.1s ease-in-out infinite; }
  .skel { animation: pulse 1.2s ease-in-out infinite; }
}
@keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(290%); } }
@keyframes pulse { 50% { opacity: .45; } }

.setup { background: var(--row); border-radius: 6px; padding: 16px; display: grid; gap: 12px; }
.setup h2 { font: 700 1.1rem/1.2 var(--f-body); margin: 0; }
.setup p { margin: 0; color: var(--muted); font-size: .92rem; }
.setup label { display: grid; gap: 4px; font-size: .88rem; font-weight: 600; }
.setup input { font: 400 1rem/1.2 var(--f-body); padding: 10px 12px; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); color: var(--ink); width: 100%; }
.setup .actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.btn { border: 2px solid var(--accent); background: var(--accent); color: var(--accent-ink); font: 600 .95rem/1 var(--f-body); padding: 11px 18px; border-radius: 999px; cursor: pointer; }
.btn.ghost { background: none; color: var(--accent); }
</style>
</head>
<body>
<main id="app">
  <header>
    <h1 class="brand">Pendel<small id="subtitle">Västtrafik, live</small></h1>
    <div class="switch" role="group" aria-label="Where are you?">
      <button id="btn-home" type="button" data-mode="home" aria-pressed="false">Home</button>
      <button id="btn-office" type="button" data-mode="office" aria-pressed="false">Office</button>
    </div>
  </header>

  <form class="setup" id="setup" hidden>
    <h2>Connect to Västtrafik</h2>
    <p>Create an application at developer.vasttrafik.se, subscribe it to Planera Resa v4, and paste its key and secret here. They are stored only in this browser.</p>
    <label for="client-id">Key (client id)<input id="client-id" autocomplete="off" spellcheck="false" required></label>
    <label for="client-secret">Secret<input id="client-secret" type="password" autocomplete="off" spellcheck="false" required></label>
    <div class="actions">
      <button class="btn" type="submit">Save and load</button>
      <button class="btn ghost" id="try-demo" type="button">Show example data</button>
    </div>
  </form>

  <div id="dash" hidden>
    <div style="display:grid;gap:18px">
      <p class="route" id="route"></p>
      <div class="notice" id="notice" hidden></div>
      <div class="loader" id="loader" role="status" aria-live="polite" hidden>
        <div class="loader-board">
          <div class="eyebrow" id="loader-label">Finding buses</div>
          <div class="loader-title" id="loader-title">Loading…</div>
          <div class="loader-track"><span></span></div>
        </div>
        <div class="list" aria-hidden="true">
          <div class="skel-row"><div><div class="skel"></div><div class="skel short"></div></div><div class="skel"></div></div>
          <div class="skel-row"><div><div class="skel"></div><div class="skel short"></div></div><div class="skel"></div></div>
          <div class="skel-row"><div><div class="skel"></div><div class="skel short"></div></div><div class="skel"></div></div>
          <div class="skel-row"><div><div class="skel"></div><div class="skel short"></div></div><div class="skel"></div></div>
        </div>
      </div>
      <div id="content" style="display:grid;gap:18px" hidden>
        <div class="hero" id="hero" hidden></div>
        <section>
          <h2 id="trips-title">Trips</h2>
          <div class="list" id="trips"></div>
          <button class="linkbtn" id="more" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span id="more-label">Load later trips</span></button>
        </section>
        <section>
          <h2>Next departures per leg</h2>
          <div class="boards" id="boards"></div>
        </section>
      </div>
      <div class="status">
        <span id="updated">–</span>
        <span class="right">
          <button class="linkish" id="forget" type="button">Change key</button>
          <button class="refresh" id="refresh" type="button">Refresh</button>
        </span>
      </div>
    </div>
  </div>
</main>

<script>
(() => {
  // ---------- Settings ----------
  const API = 'https://ext-api.vasttrafik.se';
  const TRANSFER_MINUTES = 2;
  // Which rides each view lists by default, by departure from the first stop. "Load more" adds 30 minutes.
  const WINDOWS = { home: ['06:00', '09:30'], office: ['15:00', '17:30'] };
  const MORE_MINUTES = 30;
  // Departures worth listing from the home stop: these lines, heading for a destination containing
  // one of these names (matched against the bus's destination sign). Empty means no filter.
  const HOME_LINES = ['300', '430'];
  const HOME_DIRECTIONS = ['Landvetter', 'Åkareplatsen'];
  // Stop names are looked up once and the matched stop is remembered.
  // To pin a stop, replace its name with { gid: '9021014...', name: '...' }.
  const STOPS = {
    home: 'Källarbacken',
    office: ['Gårdatorget', 'Liseberg station'],
  };
  // Where you can change bus between home and work. `to` names the office stops reachable from there
  // (as written in STOPS.office); `lines` limits which home-stop lines go there (omit for any line).
  const TRANSFERS = [
    { stop: 'Delsjömotet', to: ['Gårdatorget', 'Liseberg station'] },
    { stop: 'Landvetter', to: ['Liseberg station'], lines: ['430'] },
  ];

  const $ = id => document.getElementById(id);
  const store = {
    get(k) { try { return JSON.parse(localStorage.getItem('pendel.' + k)); } catch { return null; } },
    set(k, v) { try { localStorage.setItem('pendel.' + k, JSON.stringify(v)); } catch {} },
    del(k) { try { localStorage.removeItem('pendel.' + k); } catch {} },
  };

  // On load: home until 10:30, office after. The toggle switches for this visit only.
  function defaultMode() {
    const now = new Date();
    return now.getHours() * 60 + now.getMinutes() < 10 * 60 + 30 ? 'home' : 'office';
  }
  let mode = defaultMode();
  let data = null;
  let demo = false;

  // ---------- Västtrafik client ----------
  let token = null;

  async function getToken() {
    if (token && token.expiresAt > Date.now() + 60_000) return token.value;
    const creds = store.get('creds');
    if (!creds) throw new NeedsSetup();
    const res = await fetch(`${API}/token`, {
      method: 'POST',
      headers: { Authorization: 'Basic ' + btoa(`${creds.id}:${creds.secret}`), 'Content-Type': 'application/x-www-form-urlencoded' },
      body: 'grant_type=client_credentials',
    });
    if (res.status === 400 || res.status === 401) throw new NeedsSetup('Västtrafik did not accept that key and secret.');
    if (!res.ok) throw new Error(`Västtrafik answered ${res.status} when logging in.`);
    const body = await res.json();
    token = { value: body.access_token, expiresAt: Date.now() + (body.expires_in || 3600) * 1000 };
    return token.value;
  }
  class NeedsSetup extends Error {}

  async function vt(path, params) {
    const url = new URL(`${API}/pr/v4${path}`);
    for (const [k, v] of Object.entries(params)) url.searchParams.set(k, String(v));
    for (let attempt = 0; attempt < 2; attempt++) {
      const res = await fetch(url, { headers: { Authorization: `Bearer ${await getToken()}`, Accept: 'application/json' } });
      if (res.status === 401 && attempt === 0) { token = null; continue; }
      if (!res.ok) throw new Error(`Västtrafik answered ${res.status} for ${path}.`);
      return res.json();
    }
  }

  async function resolveStop(stop) {
    if (typeof stop === 'object') return stop;
    const cached = store.get('stops') || {};
    if (cached[stop]) return cached[stop];
    const body = await vt('/locations/by-text', { q: stop, types: 'stoparea', limit: 5 });
    const hit = (body.results || []).find(r => r.gid);
    if (!hit) throw new Error(`No stop called "${stop}" was found.`);
    const found = { gid: hit.gid, name: hit.name };
    store.set('stops', { ...store.get('stops'), [stop]: found });
    return found;
  }

  // ---------- Trips ----------
  const call = p => ({
    planned: p.plannedTime,
    time: p.estimatedOtherwisePlannedTime || p.estimatedTime || p.plannedTime,
    realtime: Boolean(p.estimatedTime),
    stop: p.stopPoint?.name || p.stopPoint?.stopArea?.name || null,
    platform: p.stopPoint?.platform || null,
  });

  function toLeg(l) {
    const sj = l.serviceJourney || {}, line = sj.line || {};
    return {
      journeyId: sj.gid || null,
      line: line.shortName || line.designation || line.name || '?',
      lineName: line.name || null,
      colors: { bg: line.backgroundColor || null, fg: line.foregroundColor || null, border: line.borderColor || null },
      direction: sj.direction || null,
      cancelled: Boolean(l.isCancelled || l.isPartCancelled),
      from: call(l.origin),
      to: call(l.destination),
    };
  }

  const ms = iso => new Date(iso).getTime();
  const minutesBetween = (a, b) => Math.round((ms(b) - ms(a)) / 60000);

  // RFC 3339 in local time, e.g. 2026-10-05T06:00:00+02:00.
  function localIso(d) {
    const pad = n => String(Math.abs(n)).padStart(2, '0');
    const off = -d.getTimezoneOffset();
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}:00`
      + `${off >= 0 ? '+' : '-'}${pad(Math.trunc(off / 60))}:${pad(off % 60)}`;
  }

  // Direct (no change) trips leaving between start and end, fetched page by page.
  async function tripsBetween(from, to, start, end) {
    const seen = new Map();
    let cursor = start;
    for (let page = 0; page < 6 && cursor < end; page++) {
      const body = await vt('/journeys', {
        originGid: from.gid, destinationGid: to.gid, onlyDirectConnections: true,
        dateTime: localIso(new Date(cursor)), limit: 20,
      });
      const legs = (body.results || [])
        .map(r => (r.tripLegs || []).filter(l => l.serviceJourney))
        .filter(ls => ls.length === 1)
        .map(ls => toLeg(ls[0]));
      if (!legs.length) break;
      for (const l of legs) seen.set(`${l.journeyId}|${l.from.planned}`, l);
      const last = Math.max(...legs.map(l => ms(l.from.planned)));
      if (last < cursor) break;
      cursor = last + 60_000;
    }
    return [...seen.values()]
      .filter(l => ms(l.from.planned) >= start && ms(l.from.planned) < end)
      .sort((a, b) => ms(a.from.time) - ms(b.from.time));
  }

  // The default window today, stretched by "Load more". Once it has passed, show the next two hours instead.
  function windowFor(m, extra) {
    const at = hm => { const [h, min] = hm.split(':').map(Number); const d = new Date(); d.setHours(h, min, 0, 0); return d.getTime(); };
    const [from, to] = WINDOWS[m];
    const end = at(to) + extra * 60_000;
    if (Date.now() <= end) return { start: at(from), end, rolling: false };
    return { start: Date.now() - 15 * 60_000, end: Date.now() + (120 + extra) * 60_000, rolling: true };
  }

  // A departure from a stop's departure board, in the same shape as a journey leg (arrival still unknown).
  function fromDeparture(d) {
    const sj = d.serviceJourney || {}, line = sj.line || {};
    return {
      journeyId: sj.gid || null,
      detailsReference: d.detailsReference || null,
      line: line.shortName || line.designation || line.name || '?',
      lineName: line.name || null,
      colors: { bg: line.backgroundColor || null, fg: line.foregroundColor || null, border: line.borderColor || null },
      direction: sj.direction || sj.directionDetails?.shortDirection || null,
      cancelled: Boolean(d.isCancelled || d.isPartCancelled),
      from: call(d),
      to: null,
    };
  }

  // Every departure from a stop in the window, whatever the line or direction.
  async function departuresFrom(stop, start, end) {
    const body = await vt(`/stop-areas/${stop.gid}/departures`, {
      startDateTime: localIso(new Date(start)),
      timeSpanInMinutes: Math.max(1, Math.ceil((end - start) / 60000)),
      limit: 100,
    });
    return (body.results || [])
      .map(fromDeparture)
      .filter(l => ms(l.from.planned) >= start && ms(l.from.planned) < end)
      .sort((a, b) => ms(a.from.time) - ms(b.from.time));
  }

  // A bus's own list of stops, for when the journey planner did not return it.
  const callsCache = new Map();
  async function callsOf(origin, dep) {
    if (!dep.detailsReference) return [];
    const hit = callsCache.get(dep.detailsReference);
    if (hit && Date.now() - hit.at < 5 * 60_000) return hit.value;
    let value = [];
    try {
      const body = await vt(`/stop-areas/${origin.gid}/departures/${encodeURIComponent(dep.detailsReference)}/details`, { includes: 'servicejourneycalls' });
      value = body.serviceJourneys?.[0]?.callsOnServiceJourney || [];
    } catch { /* treated as stopping nowhere useful */ }
    callsCache.set(dep.detailsReference, { at: Date.now(), value });
    return value;
  }

  // When the bus reaches target after leaving origin. A bus in the other direction has already passed it.
  function arrivalIn(calls, origin, target, dep) {
    const from = calls.findIndex(c => c.stopPoint?.stopArea?.gid === origin.gid);
    if (from < 0) return null;
    const c = calls.find((c, i) => i > from && c.stopPoint?.stopArea?.gid === target.gid);
    const planned = c && (c.plannedArrivalTime || c.plannedDepartureTime);
    if (!planned || ms(planned) < ms(dep.from.planned)) return null;
    const est = c.estimatedArrivalTime || c.estimatedDepartureTime;
    return { planned, time: est || planned, realtime: Boolean(est), stop: c.stopPoint?.name || target.name, platform: c.stopPoint?.platform || null };
  }

  const byJourney = legs => new Map(legs.filter(l => l.journeyId).map(l => [l.journeyId, l]));
  const usesTransfer = (t, leg) => !t.lines || t.lines.includes(leg.line);

  // The earliest catchable bus from the transfer stop, given when the first bus gets there.
  function changeAt(leg, at, via, destination, seconds) {
    const next = seconds.find(s => !s.cancelled && s.journeyId !== leg.journeyId && minutesBetween(at.time, s.from.time) >= TRANSFER_MINUTES);
    if (!next) return null;
    return { destination, via, direct: false, leg: next, arrives: next.to.time, transferMinutes: minutesBetween(at.time, next.from.time) };
  }
  const earliest = options => options.filter(Boolean).reduce((x, o) => !x || ms(o.arrives) < ms(x.arrives) ? o : x, null);

  // Kept for the example data: a single transfer with a known arrival.
  function onwardFor(leg, destination, seconds, directs) {
    const direct = directs.get(leg.journeyId);
    if (direct) return { destination, direct: true, leg: direct, arrives: direct.to.time, transferMinutes: null };
    return leg.to ? changeAt(leg, leg.to, shortStop(leg.to.stop), destination, seconds) : null;
  }

  async function commute(m, extra) {
    const [home, ...offices] = await Promise.all([STOPS.home, ...STOPS.office].map(resolveStop));
    const transfers = await Promise.all(TRANSFERS.map(async t => ({
      ...t,
      stop: await resolveStop(t.stop),
      officeIdx: STOPS.office.map((o, i) => t.to.includes(typeof o === 'object' ? o.name : o) ? i : -1).filter(i => i >= 0),
    })));
    const win = windowFor(m, extra);
    const { start, end } = win;
    // Second legs may leave well after the last first leg.
    const later = end + 90 * 60_000;
    const boards = [];
    let rows;

    if (m === 'office') {
      const homeTrips = await Promise.all(transfers.map(t => tripsBetween(t.stop, home, start, later)
        .then(trips => trips.filter(s => usesTransfer(t, s)))));
      const directs = await Promise.all(offices.map(o => tripsBetween(o, home, start, end).catch(() => [])));
      const rowsById = new Map();
      const addRow = (origin, leg) => {
        const key = `${origin}|${leg.journeyId || leg.from.planned}`;
        if (!rowsById.has(key)) rowsById.set(key, { origin, leg: { ...leg, to: null }, vias: [], options: [] });
        return rowsById.get(key);
      };
      await Promise.all(offices.map(async (o, oi) => {
        const ts = transfers.filter(t => t.officeIdx.includes(oi));
        const firsts = await Promise.all(ts.map(t => tripsBetween(o, t.stop, start, end)));
        ts.forEach((t, ti) => {
          boards.push({ from: o.name, to: t.stop.name, trips: firsts[ti] });
          for (const leg of firsts[ti]) {
            const row = addRow(o.name, leg);
            const via = shortStop(t.stop.name);
            row.vias.push({ name: via, at: leg.to });
            row.options.push(changeAt(leg, leg.to, via, home.name, homeTrips[transfers.indexOf(t)]));
          }
        });
        for (const d of directs[oi]) {
          addRow(o.name, d).options.push({ destination: home.name, direct: true, leg: d, arrives: d.to.time, transferMinutes: null });
        }
      }));
      rows = [...rowsById.values()].map(r => {
        const direct = r.options.find(o => o?.direct);
        return { origin: r.origin, leg: r.leg, vias: r.vias, onward: [direct || earliest(r.options)].filter(Boolean) };
      });
      transfers.forEach((t, ti) => boards.push({ from: t.stop.name, to: home.name, trips: homeTrips[ti] }));
    } else {
      const norm = t => String(t || '').toLocaleLowerCase('sv');
      const wanted = l => (!HOME_LINES.length || HOME_LINES.includes(l.line))
        && (!HOME_DIRECTIONS.length || HOME_DIRECTIONS.some(d => norm(l.direction).includes(norm(d))));
      const [deps, directs, viaTrips, onwardTrips] = await Promise.all([
        departuresFrom(home, start, end).catch(() => null),
        Promise.all(offices.map(o => tripsBetween(home, o, start, end).catch(() => []))),
        Promise.all(transfers.map(t => tripsBetween(home, t.stop, start, end).catch(() => []))),
        Promise.all(transfers.map(t => Promise.all(t.officeIdx.map(oi => tripsBetween(t.stop, offices[oi], start, later))))),
      ]);
      const directById = directs.map(byJourney), viaById = viaTrips.map(byJourney);
      // The departure board lists every bus; the planner's trips tell when most of them reach each transfer stop.
      const firsts = (deps || viaTrips.flat().filter((l, i, all) => all.findIndex(x => x.journeyId === l.journeyId) === i)).filter(wanted);
      rows = await Promise.all(firsts.map(async leg => {
        const vias = [];
        const options = offices.map(() => []);
        for (const [ti, t] of transfers.entries()) {
          if (!usesTransfer(t, leg)) continue;
          const at = viaById[ti].get(leg.journeyId)?.to || arrivalIn(await callsOf(home, leg), home, t.stop, leg);
          if (!at) continue;
          const via = shortStop(t.stop.name);
          vias.push({ name: via, at });
          t.officeIdx.forEach((oi, k) => options[oi].push(changeAt(leg, at, via, offices[oi].name, onwardTrips[ti][k])));
        }
        const onward = offices.map((o, oi) => {
          const d = directById[oi].get(leg.journeyId);
          return d ? { destination: o.name, direct: true, leg: d, arrives: d.to.time, transferMinutes: null } : earliest(options[oi]);
        }).filter(Boolean);
        return { origin: home.name, leg, vias, onward };
      }));
      // Without a direction list, a bus that reaches no transfer stop is going the other way.
      if (!HOME_DIRECTIONS.length) rows = rows.filter(r => r.vias.length || r.onward.length);
      transfers.forEach((t, ti) => {
        boards.push({ from: home.name, to: t.stop.name, trips: viaTrips[ti].filter(wanted) });
        t.officeIdx.forEach((oi, k) => boards.push({ from: t.stop.name, to: offices[oi].name, trips: onwardTrips[ti][k] }));
      });
    }
    rows.sort((a, b) => ms(a.leg.from.time) - ms(b.leg.from.time));
    return {
      generatedAt: new Date().toISOString(), window: win, rows, boards,
      stops: { home: home.name, transfers: transfers.map(t => t.stop.name), office: offices.map(o => o.name) },
    };
  }

  // ---------- Rendering ----------
  const hhmm = iso => new Date(iso).toLocaleTimeString('sv-SE', { hour: '2-digit', minute: '2-digit' });
  const minsUntil = iso => Math.floor((ms(iso) - Date.now()) / 60000);
  const delay = c => c.realtime && c.planned ? Math.round((ms(c.time) - ms(c.planned)) / 60000) : 0;
  const esc = s => String(s ?? '').replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
  const shortStop = s => String(s || '').replace(/,\s*[^,]+$/, '');

  function lineBadge(leg) {
    const c = leg.colors || {};
    const style = c.bg ? `background:${esc(c.bg)};color:${esc(c.fg || '#fff')};border-color:${esc(c.border || c.fg || c.bg)}` : '';
    return `<span class="line" style="${style}" title="${esc(leg.lineName || leg.line)}">${esc(leg.line)}</span>`;
  }
  function delayText(c) {
    const d = delay(c);
    if (!c.realtime) return 'Scheduled';
    if (d > 0) return `+${d} min late`;
    if (d < 0) return `${-d} min early`;
    return 'On time';
  }
  const changed = c => c.realtime && hhmm(c.time) !== hhmm(c.planned);

  // Departure–arrival, realtime times that differ from the timetable highlighted, with the planned ones struck below.
  function timesHtml(dep, arr, cancelled) {
    const t = c => `<span class="t${!cancelled && changed(c) ? ' changed' : ''}">${hhmm(c.time)}</span>`;
    const planned = [dep, arr].some(changed) && !cancelled
      ? `<div class="planned">${[dep, arr].map(c => changed(c) ? `<s>${hhmm(c.planned)}</s>` : '<span></span>').join('')}</div>` : '';
    return `<div class="tt">${t(dep)}-${t(arr)}</div>${planned}`;
  }
  function fromHtml(call) {
    return `<b>${esc(shortStop(call.stop))}</b>${call.platform ? ` <span class="platform">Platform ${esc(call.platform)}</span>` : ''}`;
  }
  function leavesIn(iso) {
    const m = minsUntil(iso);
    if (m >= 60) return '';
    return `<span class="soon">${m <= 0 ? 'Leaving now' : `Leaves in ${m} min`}</span>`;
  }

  function render() {
    for (const b of document.querySelectorAll('.switch button')) b.setAttribute('aria-pressed', String(b.dataset.mode === mode));
    $('loader').hidden = Boolean(data) || !busy;
    $('content').hidden = !data;
    $('route').hidden = !data;
    if (!data) { renderLoader(); return; }
    const s = data.stops, offices = s.office.map(shortStop).join(' / ');
    $('route').innerHTML = mode === 'home'
      ? `<b>${esc(shortStop(s.home))}</b> → ${s.transfers.map(t => esc(shortStop(t))).join(' / ')} → <b>${esc(offices)}</b>`
      : `<b>${esc(offices)}</b> → ${s.transfers.map(t => esc(shortStop(t))).join(' / ')} → <b>${esc(shortStop(s.home))}</b>`;
    $('subtitle').textContent = demo ? 'Example data' : 'Västtrafik, live';
    renderHero(data.rows.find(r => !r.leg.cancelled && r.onward.length && minsUntil(r.leg.from.time) >= 0));
    renderTrips(data.rows, data.window);
    renderBoards(data.boards);
    const age = Math.round((Date.now() - ms(data.generatedAt)) / 60000);
    $('updated').textContent = `Updated ${hhmm(data.generatedAt)}${age >= 2 ? ` (${age} min ago)` : ''}`;
  }

  function renderLoader() {
    const name = s => shortStop(typeof s === 'object' ? s.name : s);
    const from = mode === 'home' ? name(STOPS.home) : STOPS.office.map(name).join(' and ');
    const to = mode === 'home' ? STOPS.office.map(name).join(' / ') : name(STOPS.home);
    $('updated').textContent = '';
    $('loader-label').textContent = `${mode === 'home' ? 'Home' : 'Office'} · finding buses`;
    $('loader-title').textContent = `${from} → ${to}`;
  }

  const best = row => row.onward.reduce((x, o) => !x || ms(o.arrives) < ms(x.arrives) ? o : x, null);

  function renderHero(row) {
    const hero = $('hero');
    hero.hidden = !row;
    if (!row) return;
    const o = best(row), first = row.leg;
    const m = minsUntil(first.from.time);
    const firstLeg = { ...first, to: row.vias.find(v => v.name === o.via)?.at || null };
    const legs = (o.direct ? [o.leg] : [firstLeg, o.leg]).map(l => `
      <div class="hero-leg">
        ${lineBadge(l)}
        <div class="where">${esc(shortStop(l.from.stop))} → ${esc(shortStop(l.to?.stop || o.destination))}</div>
        <div class="t">${hhmm(l.from.time)}</div>
      </div>`).join('');
    const change = o.direct ? 'Direct, no change' : `${o.transferMinutes} min to change at ${esc(o.via)}`;
    hero.innerHTML = `
      <div class="hero-top"><span>Next trip from ${esc(shortStop(first.from.stop))}</span><span>${delayText(first.from)}</span></div>
      <div class="countdown">${m <= 0 ? 'Now' : m >= 60 ? hhmm(first.from.time) : `${m}<span>min</span>`}</div>
      <div class="hero-legs">${legs}</div>
      <div class="hero-foot"><span>${change}</span><span>${esc(shortStop(o.destination))} ${hhmm(o.arrives)} · ${minutesBetween(first.from.time, o.arrives)} min</span></div>`;
  }

  const departed = row => ms(row.leg.from.time) < Date.now();

  function depTimeHtml(c, cancelled) {
    const struck = !cancelled && changed(c) ? `<div class="planned"><s>${hhmm(c.planned)}</s></div>` : '';
    return `<div class="tt"><span class="t${!cancelled && changed(c) ? ' changed' : ''}">${hhmm(c.time)}</span></div>${struck}`;
  }

  function hopHtml(o, row) {
    const arrives = `<span class="hop-arr">${hhmm(o.arrives)}<small>${minutesBetween(row.leg.from.time, o.arrives)} min</small></span>`;
    if (o.direct) return `<div class="hop">${lineBadge(o.leg)}<span class="hop-what">Stay on to <b>${esc(shortStop(o.destination))}</b></span>${arrives}</div>`;
    return `<div class="hop">${lineBadge(o.leg)}<span class="hop-what">${hhmm(o.leg.from.time)} from ${esc(o.via)} to <b>${esc(shortStop(o.destination))}</b>
      <span class="${o.transferMinutes <= 3 ? 'tight' : ''}">· ${o.transferMinutes} min change</span></span>${arrives}</div>`;
  }

  function renderTrips(rows, win) {
    const t = n => hhmm(new Date(n).toISOString());
    $('trips-title').textContent = win.rolling ? `Departures · next ${Math.round((win.end - Date.now()) / 3600000 * 2) / 2} h` : `Departures · ${t(win.start)}–${t(win.end)}`;
    $('more-label').textContent = `Load later departures (until ${t(win.end + MORE_MINUTES * 60_000)})`;
    if (!rows.length) { $('trips').innerHTML = '<div class="empty">No departures in this time window.</div>'; return; }
    const firstUpcoming = rows.findIndex(r => !departed(r));
    const nowLine = `<div class="now-divider"><span>Now ${t(Date.now())}</span></div>`;
    $('trips').innerHTML = rows.map((row, i) => {
      const { leg } = row;
      const gone = departed(row);
      const state = leg.cancelled ? '<span class="cancel">Cancelled</span>' : gone ? '<span class="pill-gone">Departed</span>' : leavesIn(leg.from.time);
      const via = row.vias.length ? row.vias.map(v => `${esc(v.name)} ${hhmm(v.at.time)}`).join(' · ')
        : row.onward.some(o => o.direct) ? '' : 'No change stop on this route';
      const onward = row.onward.length && !leg.cancelled
        ? `<div class="onward">${row.onward.map(o => hopHtml(o, row)).join('')}</div>`
        : row.vias.length && !leg.cancelled ? `<div class="onward"><div class="hop none">No onward bus to catch in time</div></div>` : '';
      return `${i === firstUpcoming && i > 0 ? nowLine : ''}
        <div class="trip${leg.cancelled ? ' cancelled' : ''}${gone ? ' gone' : ''}${!row.vias.length && !row.onward.length ? ' elsewhere' : ''}">
          <div class="trip-main">
            <div class="trip-from">${fromHtml(leg.from)}</div>
            <div class="lines">${lineBadge(leg)}<span class="dir">Towards ${esc(shortStop(leg.direction) || '?')}</span></div>
            <div class="trip-note">${state}${via ? `<span>${via}</span>` : ''}</div>
          </div>
          <div class="trip-times">${depTimeHtml(leg.from, leg.cancelled)}</div>
          ${onward}
        </div>`;
    }).join('') + (firstUpcoming === -1 ? nowLine : '');
  }

  const upcoming = trips => trips.filter(t => ms(t.from.time) >= Date.now() - 60_000);

  function renderBoards(boards) {
    $('boards').innerHTML = boards.map(b => {
      const trips = upcoming(b.trips).slice(0, 6);
      return `
      <section>
        <h2>${esc(shortStop(b.from))} → ${esc(shortStop(b.to))}</h2>
        <div class="list">${trips.length ? trips.map(t => `
          <div class="trip${t.cancelled ? ' cancelled' : ''}">
            <div class="trip-main">
              <div class="trip-from">${fromHtml(t.from)}</div>
              <div class="lines">${lineBadge(t)}</div>
              <div class="trip-note">${t.cancelled ? '<span class="cancel">Cancelled</span>' : leavesIn(t.from.time)}<span>Towards ${esc(shortStop(t.direction) || shortStop(b.to))}</span></div>
            </div>
            <div class="trip-times">
              ${timesHtml(t.from, t.to, t.cancelled)}
              <div class="dur">Travel time ${minutesBetween(t.from.time, t.to.time)} min</div>
            </div>
          </div>`).join('') : '<div class="empty">No direct departures.</div>'}
        </div>
      </section>`;
    }).join('');
  }

  // ---------- Loading ----------
  function showSetup(message) {
    $('dash').hidden = true; $('setup').hidden = false;
    const creds = store.get('creds');
    $('client-id').value = creds?.id || '';
    $('client-secret').value = '';
    const p = $('setup').querySelector('p');
    if (message) { p.textContent = message; p.style.color = 'var(--bad)'; }
  }

  let loading = 0, busy = false, extra = 0;
  // Set when a view is opened; the next successful load scrolls past departed rides once.
  // Background refreshes and "Load more" leave the scroll position alone.
  let scrollToNow = true;

  function scrollPastDeparted() {
    const now = document.querySelector('#trips .now-divider');
    if (!now || !document.querySelector('#trips .trip.gone')) return;
    const smooth = !matchMedia('(prefers-reduced-motion: reduce)').matches;
    const headerBottom = document.querySelector('header').getBoundingClientRect().bottom;
    scrollTo({ top: scrollY + now.getBoundingClientRect().top - headerBottom - 8, behavior: smooth ? 'smooth' : 'auto' });
  }
  const wait = ms => new Promise(r => setTimeout(r, ms));
  // minMs keeps the loading screen up long enough to read instead of flashing.
  async function load(minMs = 0) {
    if (!demo && !store.get('creds')) { showSetup(); return; }
    $('setup').hidden = true; $('dash').hidden = false;
    const ticket = ++loading;
    busy = true;
    document.body.classList.add('loading');
    render();
    try {
      const [result] = await Promise.all([demo ? demoData(mode) : commute(mode, extra), wait(minMs)]);
      if (ticket !== loading) return;
      data = result;
      $('notice').hidden = true;
    } catch (err) {
      if (ticket !== loading) return;
      if (err instanceof NeedsSetup) { showSetup(err.message); return; }
      const n = $('notice');
      n.textContent = err instanceof TypeError
        ? 'Could not reach Västtrafik. Check your connection.'
        : `Could not load departures: ${err.message}`;
      n.classList.add('error'); n.hidden = false;
    } finally {
      if (ticket === loading) { busy = false; document.body.classList.remove('loading'); }
      render();
      if (ticket === loading && data && scrollToNow) { scrollToNow = false; requestAnimationFrame(scrollPastDeparted); }
    }
  }

  $('setup').addEventListener('submit', e => {
    e.preventDefault();
    store.set('creds', { id: $('client-id').value.trim(), secret: $('client-secret').value.trim() });
    token = null; demo = false; load();
  });
  $('try-demo').addEventListener('click', () => { demo = true; data = null; scrollToNow = true; load(500); });
  $('forget').addEventListener('click', () => { store.del('creds'); store.del('stops'); token = null; demo = false; data = null; showSetup(); });
  $('refresh').addEventListener('click', () => load());
  $('more').addEventListener('click', async () => {
    extra += MORE_MINUTES;
    $('more').disabled = true; $('more-label').textContent = 'Loading…';
    await load();
    $('more').disabled = false; render();
  });
  for (const b of document.querySelectorAll('.switch button')) {
    b.addEventListener('click', () => {
      if (mode === b.dataset.mode) return;
      mode = b.dataset.mode; extra = 0; data = null; scrollToNow = true; $('notice').hidden = true; load(500);
    });
  }

  // Example trips relative to now, for trying the page without a key.
  function demoData(m) {
    const at = min => new Date(Date.now() + min * 60000).toISOString();
    const point = (stop, min, late = 0) => ({ stop, planned: at(min), time: at(min + late), realtime: true, platform: 'A' });
    let n = 0;
    const leg = (line, fg, from, to, dep, dur, late = 0, direction = shortStop(to)) => ({
      journeyId: `demo-${n++}`, line, lineName: `Line ${line}`, colors: { bg: '#ffef5c', fg, border: fg }, direction,
      cancelled: false, from: point(from, dep, late), to: to ? point(to, dep + dur, late) : null,
    });
    const H = 'Källarbacken, Göteborg', T = 'Delsjömotet, Göteborg', G = 'Gårdatorget, Göteborg', L = 'Liseberg station, Göteborg';
    const stops = { home: H, transfers: [T], office: [G, L] };
    const vias = f => f.to ? [{ name: shortStop(f.to.stop), at: f.to }] : [];
    const window = { start: Date.now() - 40 * 60000, end: Date.now() + (60 + extra) * 60000, rolling: false };
    const none = new Map();
    if (m === 'office') {
      const second = [leg('514', '#00843d', T, H, -2, 5), leg('514', '#00843d', T, H, 13, 5), leg('514', '#00843d', T, H, 28, 5)];
      const firsts = [leg('50', '#0a5fb4', G, T, -11, 6), leg('50', '#0a5fb4', G, T, 4, 6), leg('513', '#d6007d', L, T, 7, 8, 1), leg('50', '#0a5fb4', G, T, 14, 6)];
      return { generatedAt: new Date().toISOString(), stops, window,
        rows: firsts.map(f => ({ origin: f.from.stop, leg: f, vias: vias(f), onward: [onwardFor(f, H, second, none)].filter(Boolean) })),
        boards: [{ from: G, to: T, trips: firsts }, { from: T, to: H, trips: second }] };
    }
    const toG = [leg('50', '#0a5fb4', T, G, -3, 7), leg('50', '#0a5fb4', T, G, 13, 7), leg('50', '#0a5fb4', T, G, 29, 7)];
    const toL = [leg('513', '#d6007d', T, L, 14, 9), leg('513', '#d6007d', T, L, 29, 9)];
    const firsts = [leg('514', '#00843d', H, T, -10, 5), leg('514', '#00843d', H, T, 5, 5), leg('16', '#00843d', H, null, 11, 0, 0, 'Partille'), leg('514', '#00843d', H, T, 20, 5, 2)];
    return { generatedAt: new Date().toISOString(), stops, window,
      rows: firsts.map(f => ({ origin: H, leg: f, vias: vias(f), onward: [onwardFor(f, G, toG, none), onwardFor(f, L, toL, none)].filter(Boolean) })),
      boards: [{ from: H, to: T, trips: firsts.filter(f => f.to) }, { from: T, to: G, trips: toG }, { from: T, to: L, trips: toL }] };
  }

  render();
  load();
  setInterval(() => { if (!document.hidden && !$('dash').hidden && !busy) load(); }, 30_000);
  setInterval(render, 15_000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden && !$('dash').hidden && !busy) load(); });
})();
</script>
</body>
</html>
